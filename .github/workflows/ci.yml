name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match requires-python = ">=3.11" in backend/pyproject.toml.
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Editable install of the backend package plus the `dev` extra,
      # which provides pytest (declared in [project.optional-dependencies]).
      # `uv pip install` into the runner's system Python keeps the
      # invocation identical to the README's `pip install -e .` path.
      - name: Install backend dependencies
        run: uv pip install --system -e ".[dev]"

      # Deselect network-gated tests so CI is deterministic: the
      # bulk-cache test in test_chain_availability hits live data and
      # flakes cold/offline (see backend/pyproject.toml markers).
      - name: Run pytest
        run: pytest -q -m "not network"

  # Proves the additive migrations + the suite run on Postgres, not just
  # SQLite. Same install path; the only difference is DATABASE_URL points
  # at a postgres:16 service container. init_db() runs the additive
  # migrations on first connect, so a green run here means the ALTER TABLE
  # ladder is Postgres-valid.
  backend-postgres:
    name: Backend (pytest, Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trade
          POSTGRES_PASSWORD: trade
          POSTGRES_DB: trade_test
        ports:
          - 5432:5432
        # Wait for the DB to accept connections before the job runs.
        options: >-
          --health-cmd "pg_isready -U trade -d trade_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # psycopg (v3) driver — installed via the pg extra below.
      DATABASE_URL: postgresql+psycopg://trade:trade@localhost:5432/trade_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pull in the Postgres driver alongside the dev extra.
      - name: Install backend dependencies
        run: uv pip install --system -e ".[dev,pg]"

      # Run the additive migrations explicitly against Postgres first so a
      # migration failure is an unambiguous, isolated step (init_db() is
      # idempotent, so the test run re-invoking it is a safe no-op).
      - name: Run additive migrations on Postgres
        run: python -c "from database import init_db; init_db()"

      - name: Run pytest against Postgres
        run: pytest -q -m "not network"

  # WS2 quality gates (backend): lint + type check + dependency vuln scan.
  #
  # These are intentionally NON-BLOCKING for now (continue-on-error: true).
  # The repo carries pre-existing ruff (UP/B/I) and mypy findings in
  # routers/services that WS2 does not own and must not touch. Running the
  # gates here SURFACES those findings in the Actions log on every push
  # without red-flagging the build on day one. Once the backlog is paid
  # down (a follow-up cleanup pass), flip `continue-on-error` to false on
  # each step to make it a hard gate.
  backend-quality:
    name: Backend (ruff + mypy + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The `dev` extra carries ruff + mypy (see [project.optional-dependencies]).
      - name: Install backend dependencies
        run: uv pip install --system -e ".[dev]"

      # Lint. ruff config (line-length, select/ignore) lives in pyproject.toml.
      - name: Ruff lint
        continue-on-error: true
        run: ruff check .

      # Type check. --ignore-missing-imports keeps third-party libs without
      # stubs (alpaca-py, finnhub, pandas_market_calendars, …) from drowning
      # the signal; we don't own pyproject's [tool.mypy], so it's a flag, not
      # config. Explicit Python version pins the inference target.
      - name: Mypy type check
        continue-on-error: true
        run: mypy --ignore-missing-imports --python-version 3.11 .

      # Dependency vulnerability scan. Non-blocking (the plan's guidance) so a
      # flagged transitive dep doesn't red the build before triage; uvx runs
      # pip-audit in an ephemeral env without polluting the install above.
      - name: pip-audit (dependency vuln scan)
        continue-on-error: true
        run: uvx pip-audit || true

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # WS2 quality gate (frontend): ESLint flat config (eslint.config.js).
      # Non-blocking for now for the same reason as the backend gates — it
      # surfaces lint findings without breaking the build until the existing
      # ones are cleared. Flip continue-on-error to false to harden it.
      - name: ESLint
        continue-on-error: true
        run: npx eslint .

      # WS2 quality gate (frontend): unit tests.
      #
      # DEPENDS ON WS1: the `test` script (vitest) + its config land with the
      # frontend-tests workstream. `npm run test --if-present` is a NO-OP
      # until that script exists, so this step is green on merge and starts
      # actually running the suite the moment WS1 lands — no second CI edit
      # needed. Once WS1 is in, drop `--if-present` to make a missing script
      # (or a red suite) fail the job.
      - name: Unit tests (vitest — active once WS1 lands)
        run: npm run test --if-present

      - name: Build
        run: npm run build

  # B4 (P0 wave 2026-07): prove the deploy image builds — the multi-stage
  # Dockerfile is otherwise dead code until someone deploys. On a PR or a
  # side branch this is BUILD ONLY: a green build is the whole gate, and
  # publishing an image for a branch nobody deployed just fills the registry.
  #
  # On main it also PUSHES to GHCR, tagged with the commit SHA. That is the
  # rollback story: `fly deploy` builds remotely from whatever the working
  # tree happens to be, so without a published artifact "put back what was
  # running an hour ago" means reconstructing it from git and hoping the
  # build is reproducible. An immutable ghcr.io/<owner>/trade-desk:sha-<sha>
  # turns that into one command:
  #
  #   fly deploy --image ghcr.io/<owner>/trade-desk:sha-<the good sha>
  #
  # GITHUB_TOKEN already carries packages:write for its own repository, so
  # no secret has to be created. The package inherits repo visibility —
  # PRIVATE for a private repo, which is what you want: the image bakes no
  # secrets (they all arrive as runtime env) but it is still the whole
  # application.
  #
  # The GHA layer cache keeps both paths cheap: the multi-GB python-deps
  # layer only rebuilds when backend/uv.lock changes.
  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only on main, and never for a fork's PR — a fork has no write
      # credential and the step would fail for a contributor doing nothing
      # wrong.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased owner: GHCR rejects an uppercase path, and GitHub
      # usernames routinely have capitals (this one does).
      - name: Resolve image name
        id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/trade-desk" >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          # sha- prefixed so a tag can never be mistaken for a semver
          # release, plus a moving :main for "whatever is current".
          tags: |
            ${{ steps.image.outputs.repo }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.repo }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.image.outputs.repo }}:sha-${{ github.sha }}"
            echo '```'
            echo
            echo "Roll back to it with:"
            echo '```bash'
            echo "fly deploy --image ${{ steps.image.outputs.repo }}:sha-${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
