<!-- @dsCard group="Colors" viewport="700x160" name="Price semantics" subtitle="Bullish / Bearish — reserved for price moves & P&L ONLY" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--td-bg-0); font-family: var(--td-font-mono); }
  .wrap { display: flex; gap: 12px; padding: 16px; }
  .sw { flex: 1; border: 1px solid var(--td-border); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 28px; border-radius: 2px; }
  .name { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--td-fg-tertiary-2); }
  .hex { font-size: 11px; color: var(--td-fg-tertiary-2); font-variant-numeric: tabular-nums; }
  .demo { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .use { font-size: 9px; color: var(--td-fg-tertiary); }
</style>
</head>
<body class="td-root">
  <div class="wrap">
    <div class="sw">
      <div class="chip" style="background:var(--td-bullish)"></div>
      <span class="name">Bullish · #4DD17C</span>
      <span class="demo" style="color:var(--td-bullish)">+$132.93 · +0.31%</span>
      <span class="use">up candles · positive %chg · winning P&amp;L</span>
    </div>
    <div class="sw">
      <div class="chip" style="background:var(--td-bearish)"></div>
      <span class="name">Bearish · #E85C5C</span>
      <span class="demo" style="color:var(--td-bearish)">−$250.00 · −1.04%</span>
      <span class="use">down candles · negative %chg · losing P&amp;L · errors</span>
    </div>
  </div>
</body>
</html>
