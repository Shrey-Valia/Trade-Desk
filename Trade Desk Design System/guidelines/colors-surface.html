<!-- @dsCard group="Colors" viewport="700x150" name="Surface elevation" subtitle="4-tier dark-navy ground — never pure black" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--td-bg-0); font-family: var(--td-font-mono); }
  .wrap { display: flex; gap: 0; padding: 16px; }
  .sw { flex: 1; height: 104px; border: 1px solid var(--td-border); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .sw .name { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--td-fg-secondary); }
  .sw .hex { font-size: 11px; color: var(--td-fg-tertiary-2); font-variant-numeric: tabular-nums; }
  .sw .tok { font-size: 9px; color: var(--td-fg-tertiary); margin-top: 2px; }
</style>
</head>
<body class="td-root">
  <div class="wrap">
    <div class="sw" style="background:var(--td-bg-0)"><span class="name">Body</span><span class="hex">#131722</span><span class="tok">--td-bg-0</span></div>
    <div class="sw" style="background:var(--td-bg-1)"><span class="name">Panel</span><span class="hex">#1A1F2D</span><span class="tok">--td-bg-1</span></div>
    <div class="sw" style="background:var(--td-bg-2)"><span class="name">Raised</span><span class="hex">#222837</span><span class="tok">--td-bg-2</span></div>
    <div class="sw" style="background:var(--td-bg-3)"><span class="name">Active</span><span class="hex">#2A3142</span><span class="tok">--td-bg-3</span></div>
  </div>
</body>
</html>
