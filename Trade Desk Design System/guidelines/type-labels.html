<!-- @dsCard group="Type" viewport="700x140" name="Uppercase labels" subtitle="9-11px · 0.08em tracking · the terminal's label voice" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--td-bg-0); font-family: var(--td-font-mono); }
  .wrap { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 16px; align-content: flex-start; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--td-fg-secondary); border: 1px solid var(--td-border); padding: 4px 8px; border-radius: 2px; background: var(--td-bg-1); }
</style>
</head>
<body class="td-root">
  <div class="wrap">
    <span class="lbl">BAL</span><span class="lbl">MLL</span><span class="lbl">DLL</span><span class="lbl">RP&amp;L</span><span class="lbl">UP&amp;L</span><span class="lbl">MKT</span>
    <span class="lbl">OPTION CHAIN</span><span class="lbl">TRADE TICKET</span><span class="lbl">OPEN POSITION</span><span class="lbl">THETA SCRUBBER</span><span class="lbl">KEY LEVELS</span><span class="lbl">TODAY</span>
  </div>
</body>
</html>
