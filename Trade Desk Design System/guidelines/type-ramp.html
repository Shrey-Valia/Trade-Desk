<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--td-bg-0); font-family: var(--td-font-mono); }
  .wrap { display: flex; flex-direction: column; padding: 14px 16px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 4px 0; border-bottom: 1px solid var(--td-border); }
  .row:last-child { border-bottom: none; }
  .spec { width: 120px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--td-fg-tertiary-2); }
  .sample { color: var(--td-fg-primary); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="td-root">
  <div class="wrap">
    <div class="row"><span class="spec">Display · 19/24</span><span class="sample" style="font-size:19px;font-weight:500">$758.65</span></div>
    <div class="row"><span class="spec">Large · 17/22</span><span class="sample" style="font-size:17px;font-weight:500">IV Rank 72</span></div>
    <div class="row"><span class="spec">Medium · 15/20</span><span class="sample" style="font-size:15px;font-weight:500">SPY 0DTE</span></div>
    <div class="row"><span class="spec">Body · 13/18</span><span class="sample" style="font-size:13px">Click a strike in the chain</span></div>
    <div class="row"><span class="spec">Tiny · 11/14</span><span class="sample" style="font-size:11px">exp 2026-06-01 · ATM 759</span></div>
    <div class="row"><span class="spec">Micro · 9/12</span><span class="sample" style="font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--td-fg-secondary)">OPTION CHAIN</span></div>
  </div>
</body>
</html>
