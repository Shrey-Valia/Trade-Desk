<!-- @dsCard group="Journal" viewport="1440x860" name="Trade Journal" subtitle="Monthly calendar of daily P&L — click a day for its trades, greeks, notes & tags" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Desk — Journal</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../combine/combine.css">
<link rel="stylesheet" href="journal.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../data/trades.js"></script>
</head>
<body class="td-root">
<div id="root"></div>
<script type="text/babel">
const J = window.TDJournal;
const { TRADES, summarize, fmt, fmtHold } = J;

// Two months of activity. firstWeekday: Mon=0 .. Sun=6.
const MONTHS = [
  { abbr: "May", label: "May 2026", days: 31, firstWeekday: 4 }, // May 1 2026 = Fri
  { abbr: "Jun", label: "June 2026", days: 30, firstWeekday: 0 }, // Jun 1 2026 = Mon
];
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const TODAY = "Jun 5";

const byDate = {};
TRADES.forEach((t) => { (byDate[t.date] = byDate[t.date] || []).push(t); });

function Rail({ active }) {
  const ICONS = {
    chart: <g><line x1="6" y1="3" x2="6" y2="17"/><rect x="4" y="6" width="4" height="7" fill="currentColor"/><line x1="14" y1="3" x2="14" y2="17"/><rect x="12" y="8" width="4" height="5"/></g>,
    journal: <g><path d="M4 4h9a2 2 0 0 1 2 2v11H6a2 2 0 0 1-2-2V4z"/><line x1="7" y1="8" x2="12" y2="8"/><line x1="7" y1="11" x2="12" y2="11"/><line x1="7" y1="14" x2="10" y2="14"/></g>,
    analytics: <g><line x1="3" y1="17" x2="17" y2="17"/><rect x="4" y="11" width="3" height="6"/><rect x="9" y="7" width="3" height="10"/><rect x="14" y="4" width="3" height="13"/></g>,
    watchlist: <g><circle cx="4.5" cy="5.5" r="1" fill="currentColor" stroke="none"/><line x1="8" y1="5.5" x2="17" y2="5.5"/><circle cx="4.5" cy="10" r="1" fill="currentColor" stroke="none"/><line x1="8" y1="10" x2="17" y2="10"/><circle cx="4.5" cy="14.5" r="1" fill="currentColor" stroke="none"/><line x1="8" y1="14.5" x2="17" y2="14.5"/></g>,
    settings: <g><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></g>,
  };
  const G = ({ n }) => <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">{ICONS[n]}</svg>;
  return (
    <nav className="cb-rail">
      <div className="cb-rail-mark"><svg viewBox="0 0 36 36" width="32" height="32"><rect x="1" y="1" width="34" height="34" rx="5" ry="5" fill="none" stroke="var(--td-amber)" strokeWidth="2"/><text x="18" y="18" textAnchor="middle" dominantBaseline="central" fontFamily="var(--td-font-mono)" fontSize="20" fontWeight="500" letterSpacing="-0.02em" fill="var(--td-fg-primary)">TD</text></svg></div>
      {[["chart","Chart"],["journal","Journal"],["analytics","Analytics"],["watchlist","Watch"]].map(([k,l]) => <button key={k} className={"cb-rail-btn" + (active===k?" active":"")} title={l}><G n={k}/><span>{l}</span></button>)}
      <button className="cb-rail-btn cb-rail-foot" title="Settings"><G n="settings"/><span>Settings</span></button>
    </nav>
  );
}

function MiniCurve({ t }) {
  const W = 200, H = 56, n = 12, seed = t.id * 2.39;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n;
    const base = t.pnl * f;
    const wig = Math.sin(seed + f*7) * Math.abs(t.pnl) * 0.28 * (1-f) + Math.cos(seed*1.7 + f*4) * Math.abs(t.pnl) * 0.12;
    pts.push(base + wig);
  }
  pts[0] = 0; pts[n] = t.pnl;
  const lo = Math.min(0, ...pts), hi = Math.max(0, ...pts), span = (hi-lo)||1;
  const x = (i) => (i/n)*(W-2)+1, y = (v) => H-4-((v-lo)/span)*(H-8);
  const d = pts.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const zeroY = y(0), col = t.win ? "var(--td-bullish)" : "var(--td-bearish)";
  const area = d + ` L ${x(n).toFixed(1)} ${zeroY.toFixed(1)} L ${x(0).toFixed(1)} ${zeroY.toFixed(1)} Z`;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{display:"block",height:56}}>
      <line x1="0" y1={zeroY} x2={W} y2={zeroY} stroke="var(--td-border)" strokeWidth="1" />
      <path d={area} fill={col} opacity="0.12" /><path d={d} fill="none" stroke={col} strokeWidth="1.5" />
    </svg>
  );
}

function TradeDetail({ t }) {
  const legs = t.struct.split(/[·/]/).map((s) => s.trim()).filter(Boolean);
  const tagClass = (tag) => /good|planned/.test(tag) ? "good" : /revenge|fomo|broke/.test(tag) ? "bad" : "neutral";
  return (
    <div className="jn-detail">
      <div className="jn-dsec">
        <div className="h">Structure · {t.qty} contract{t.qty>1?"s":""}</div>
        <div className="jn-legs">
          <div className="jn-leg"><span>{t.sym} {t.strat}</span><span className="lv">{legs.length>1 ? legs.length+" legs" : legs[0]}</span></div>
          {legs.map((l, i) => <div className="jn-leg" key={i}><span>leg {i+1}</span><span className="lv">{l}</span></div>)}
          <div className="jn-leg" style={{marginTop:6}}><span>entry → exit</span><span className="lv">${t.entry.toFixed(2)} → ${t.exit.toFixed(2)}</span></div>
          <div className="jn-leg"><span>cost basis · risk</span><span className="lv">{fmt(t.risk)}</span></div>
        </div>
        <div className="jn-greeks">
          <div className="jn-greek"><span className="gl">Δ entry</span><span className="gv">{t.greeks.delta}</span></div>
          <div className="jn-greek"><span className="gl">Θ entry</span><span className="gv bear">{t.greeks.theta}</span></div>
          <div className="jn-greek"><span className="gl">Γ entry</span><span className="gv">{t.greeks.gamma}</span></div>
          <div className="jn-greek"><span className="gl">ν entry</span><span className="gv">{t.greeks.vega}</span></div>
        </div>
      </div>
      <div className="jn-dsec">
        <div className="h">Note</div>
        <div className={"jn-note" + (t.note ? "" : " empty")}>{t.note || "No note on this trade. Add one — why you took it, what happened, what you'd repeat."}</div>
        <div className="jn-tags">
          {(t.tags||[]).map((tag) => <span key={tag} className={"jn-tag " + tagClass(tag)}>{tag}</span>)}
          <span className="jn-tag add">+ tag</span>
        </div>
      </div>
      <div className="jn-dsec">
        <div className="h">Intratrade P&L</div>
        <div className="jn-curve">
          <div className="cl"><span>{t.tin}</span><span style={{color: t.win?"var(--td-bullish)":"var(--td-bearish)"}}>{fmt(t.pnl, true)}</span><span>{t.tout}</span></div>
          <MiniCurve t={t} />
        </div>
        <div className="jn-greeks" style={{gridTemplateColumns:"1fr 1fr", marginTop:10}}>
          <div className="jn-greek"><span className="gl">Hold time</span><span className="gv">{fmtHold(t.hold)}</span></div>
          <div className="jn-greek"><span className="gl">Return · R</span><span className="gv">{t.retPct>0?"+":"−"}{Math.abs(t.retPct).toFixed(0)}% · {t.rMultiple>=0?"+":"−"}{Math.abs(t.rMultiple).toFixed(2)}R</span></div>
        </div>
      </div>
    </div>
  );
}

function DayModal({ date, dow, trades, onClose }) {
  const net = trades.reduce((a,t)=>a+t.pnl,0);
  const wins = trades.filter((t)=>t.win).length;
  const wr = Math.round(wins/trades.length*100);
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  return (
    <div className="cal-backdrop" onClick={onClose}>
      <div className="cal-modal" onClick={(e)=>e.stopPropagation()}>
        <div className="cal-modal-head">
          <span className="dt">{date}, 2026</span>
          <span className="dow">{dow}</span>
          <div className="cal-modal-sum">
            <div className="ms"><span className="l">Trades</span><span className="v">{trades.length}</span></div>
            <div className="ms"><span className="l">Win rate</span><span className="v">{wr}%</span></div>
            <div className="ms"><span className="l">Day P&L</span><span className={"v " + (net>=0?"bull":"bear")}>{fmt(net, true)}</span></div>
          </div>
          <button className="cal-close" onClick={onClose} aria-label="Close">✕</button>
        </div>
        <div className="cal-modal-body">
          {trades.map((t) => (
            <React.Fragment key={t.id}>
              <div className={"cal-tradehead " + (t.win?"win":"loss")}>
                <div className="c-sym"><span className="s">{t.sym}</span><span className="st">{t.strat}</span></div>
                <div className="c-struct">{t.struct}</div>
                <div className="c-px">{t.entry.toFixed(2)}<span className="arrow">→</span>{t.exit.toFixed(2)}</div>
                <div className="c-time">{t.tin}–{t.tout}</div>
                <div className={"c-pnl " + (t.win?"win":"loss")}>{fmt(t.pnl, true)}</div>
              </div>
              <TradeDetail t={t} />
            </React.Fragment>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [mi, setMi] = React.useState(0); // 0 = May (richest), 1 = June
  const [sel, setSel] = React.useState(null);
  const m = MONTHS[mi];

  // month summary
  const monthTrades = TRADES.filter((t) => t.date.startsWith(m.abbr + " "));
  const s = summarize(monthTrades);

  // build weeks (Mon–Fri only) with a weekly total column
  const weeks = [];
  const ensure = (wi) => { if (!weeks[wi]) weeks[wi] = { idx: wi, days: [null,null,null,null,null] }; return weeks[wi]; };
  for (let d = 1; d <= m.days; d++) {
    const wd = (m.firstWeekday + d - 1) % 7;
    if (wd > 4) continue; // skip Sat / Sun
    const wi = Math.floor((m.firstWeekday + d - 1) / 7);
    const dateStr = m.abbr + " " + d;
    ensure(wi).days[wd] = { day: d, dateStr, dow: DOW[wd], trades: byDate[dateStr] || [] };
  }
  const realWeeks = weeks.filter(Boolean);

  return (
    <div className="cb-app">
      <Rail active="journal" />
      <div className="cb-main" style={{overflow:"hidden", display:"flex", flexDirection:"column"}}>
        <header className="cb-header">
          <span className="jn-title">Journal</span>
          <span className="jn-ctx">{J.TIER} Combine</span>
          <div className="jn-monthnav">
            <button className="nav" onClick={()=>setMi(Math.max(0,mi-1))} disabled={mi===0}>‹</button>
            <span className="mlabel">{m.label}</span>
            <button className="nav" onClick={()=>setMi(Math.min(MONTHS.length-1,mi+1))} disabled={mi===MONTHS.length-1}>›</button>
          </div>
          <div className="jn-summary">
            <div className="jn-sum"><span className="l">Trades</span><span className="v">{s.n}</span></div>
            <div className="jn-sum"><span className="l">Win rate</span><span className="v">{s.n?s.winRate.toFixed(0):"—"}%</span></div>
            <div className="jn-sum"><span className="l">Net P&L</span><span className={"v " + (s.net>=0?"bull":"bear")}>{fmt(s.net, true)}</span></div>
          </div>
        </header>

        <div className="cal-wrap">
          <div className="cal-dow">{["Mon","Tue","Wed","Thu","Fri"].map((d)=><span key={d}>{d}</span>)}<span>Week</span></div>
          <div className="cal-grid">
            {realWeeks.map((w) => {
              const wkTrades = w.days.flatMap((d) => d ? d.trades : []);
              const wkNet = wkTrades.reduce((a,t)=>a+t.pnl,0);
              const wkSign = wkNet > 0 ? "pos" : wkNet < 0 ? "neg" : "";
              const wkDays = w.days.filter((d)=>d && d.trades.length).length;
              return (
                <React.Fragment key={w.idx}>
                  {w.days.map((c, ci) => {
                    if (!c) return <div className="cal-cell other" key={"e"+w.idx+ci} />;
                    const has = c.trades.length > 0;
                    const net = c.trades.reduce((a,t)=>a+t.pnl,0);
                    const sign = net > 0 ? "pos" : net < 0 ? "neg" : "";
                    const hasTag = c.trades.some((t)=>t.note || (t.tags&&t.tags.length));
                    const isToday = c.dateStr === TODAY;
                    return (
                      <div key={c.dateStr}
                        className={["cal-cell", has?"has":"", has?sign:"", isToday?"today":""].join(" ")}
                        onClick={has ? () => setSel(c) : undefined}>
                        <span className="cal-date">{c.day}</span>
                        {hasTag && <span className="cal-tagdot" title="has notes / tags" />}
                        {has && <span className={"cal-net " + sign}>{fmt(net, true)}</span>}
                        {has && (
                          <span className="cal-meta">
                            <span className="cal-wl">{c.trades.map((t)=><span key={t.id} className={"cal-pip " + (t.win?"w":"l")} />)}</span>
                            {c.trades.length} trade{c.trades.length>1?"s":""}
                          </span>
                        )}
                      </div>
                    );
                  })}
                  <div className="cal-week">
                    <span className="wk-l">Week {w.idx+1}</span>
                    <span className={"wk-net " + wkSign}>{wkTrades.length ? fmt(wkNet, true) : "—"}</span>
                    <span className="wk-sub">{wkTrades.length ? wkDays+"d · "+wkTrades.length+" trades" : "no trades"}</span>
                  </div>
                </React.Fragment>
              );
            })}
          </div>
          <div className="cal-foot">
            <div className="fitem"><span className="fl">Month net</span><span className={"fv " + (s.net>=0?"bull":"bear")}>{fmt(s.net, true)}</span></div>
            <div className="fitem"><span className="fl">Trades</span><span className="fv">{s.n}</span></div>
            <div className="fitem"><span className="fl">Win rate</span><span className="fv">{s.n?s.winRate.toFixed(0):"—"}%</span></div>
            <div className="fitem"><span className="fl">Green days</span><span className="fv bull">{Object.keys(byDate).filter(d=>d.startsWith(m.abbr+" ")&&byDate[d].reduce((a,t)=>a+t.pnl,0)>0).length}</span></div>
            <span className="hint">Click any day with trades to review its fills, greeks, notes &amp; tags →</span>
          </div>
        </div>
      </div>
      {sel && <DayModal date={sel.dateStr} dow={sel.dow} trades={sel.trades} onClose={()=>setSel(null)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
