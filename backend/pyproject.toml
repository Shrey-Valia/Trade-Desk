[project]
name = "options-dashboard-backend"
version = "0.1.0"
description = "Personal options trading dashboard — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "alpaca-py>=0.33",
    "finnhub-python>=2.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "pandas-market-calendars>=4.4",
    "httpx>=0.27",
    # yfinance scrapes Yahoo's HTML; pin tightly because it breaks every
    # ~6 months when Yahoo redesigns. Bump explicitly when we re-test.
    "yfinance==1.3.0",  # tested 2026-05-15 (0.2.40 was broken against current Yahoo)
    "bcrypt>=4.1",
    "stripe>=11.0",  # payments (opt-in; imported lazily — see services/payments.py)
    # Error tracking (opt-in). Inert unless SENTRY_DSN is set — main.py's
    # lifespan skips init entirely when the DSN is blank, so a dev box / CI
    # never phones home. [fastapi] pulls the ASGI + Starlette integrations.
    "sentry-sdk[fastapi]>=2.0",
    "python-multipart>=0.0.9",  # WS4: journal screenshot multipart uploads (UploadFile)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "black>=24.10",
    "ruff>=0.7",
    "mypy>=1.13",
]
# Postgres driver. Not in core deps because SQLite is the default backend
# and a dev box needs nothing extra; install the `pg` extra (and set
# DATABASE_URL=postgresql+psycopg://…) to run against Postgres. psycopg v3
# is the modern, binary-wheel driver SQLAlchemy 2.x recommends.
pg = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# This isn't a publishable library — it's an app run via `uvicorn main:app`.
# We still install editable so deps resolve, but tell setuptools exactly
# which packages and loose modules to pick up so its flat-layout autodiscover
# doesn't choke on the mixed layout.
[tool.setuptools]
py-modules = ["main", "config", "database"]
packages = ["calculations", "jobs", "models", "routers", "schemas", "scripts", "services"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Tests that reach a live data provider (Alpaca) and are therefore
    # environment-dependent — they pass warm / at market-hours but flake
    # cold / offline. CI runs with `-m "not network"` to stay deterministic.
    "network: hits live external data (deselected in CI via -m 'not network')",
]
