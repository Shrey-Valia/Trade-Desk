# Trade Desk — single-container deployment. `docker compose up -d --build`.
# Full runbook (env var reference, backup/restore): docs/DEPLOYMENT.md.
#
# ############################  DO NOT SCALE  ############################
# NEVER run more than 1 replica of this service — no `--scale app=2`, no
# Swarm/Kubernetes replicas, no second compose project on the same volume.
# The backend runs APScheduler IN-PROCESS: a second instance double-fires
# every scheduled job (billing renewals, combine settlement, payout
# auto-approval, EOD settlement, the nightly backup), which double-charges
# and corrupts money state. Scale reads with a cache/CDN in front, never
# with more app processes.
# ########################################################################

services:
  app:
    build: .
    image: trade-dashboard:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      # SQLite DB + journal-screenshot uploads + nightly backups, all under
      # /app/data (the DATABASE_URL / upload / backup defaults in the image).
      - trade_data:/app/data
    # Bare names pass the variable through from the host shell / a `.env`
    # file next to this compose file; unset stays unset (image/config.py
    # defaults apply). Values, formats, and which ones matter in prod:
    # docs/DEPLOYMENT.md.
    environment:
      # market data
      - ALPACA_API_KEY
      - ALPACA_API_SECRET
      - ALPACA_PAPER
      - FINNHUB_API_KEY
      - FRED_API_KEY
      # deployment posture
      #
      # CAREFUL: a bare `- VAR` below does NOT mean "pass it through if the
      # host sets it, else keep the image's value". When the host doesn't
      # set it, compose UNSETS the variable in the container, erasing any
      # ENV baked into the image. That's harmless for the vars whose
      # config.py default already IS the intended production value — but
      # APP_ENV is not one of them: the image bakes `production`, compose
      # would erase it, config.py would fall back to `development`, and the
      # session cookie would silently lose its Secure flag. Hence the
      # explicit default here (override it from the host to change it).
      - APP_ENV=${APP_ENV:-production}
      - COOKIE_SECURE
      - CORS_ALLOW_ORIGINS
      - TRUST_PROXY
      - FRONTEND_BASE_URL
      - LOG_LEVEL
      - LOG_JSON
      # /health 503s when no scheduled job has run in this window — the only
      # external signal that the in-process scheduler died. 0 disables.
      - HEALTH_SCHEDULER_STALE_S
      # error tracking (unset = off; a crash is then invisible)
      - SENTRY_DSN
      - SENTRY_ENVIRONMENT
      - SENTRY_RELEASE
      # back office / payouts
      - ADMIN_EMAILS
      - PAYOUT_AUTO_APPROVE
      # closed launch — see "Invite-only launch" in docs/DEPLOYMENT.md
      - SIGNUP_REQUIRE_INVITE
      - INVITE_DEFAULT_TTL_DAYS
      # transactional mail
      - MAIL_PROVIDER
      - MAIL_FROM
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_STARTTLS
      # Implicit TLS instead of STARTTLS — what port-465 relays expect.
      - SMTP_SSL
      # Stripe (opt-in; payments stay simulated while unset)
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_PRICE_50K
      - STRIPE_PRICE_100K
      - STRIPE_PRICE_150K
      # backups / migration escape hatch
      - BACKUP_RETENTION_DAYS
      - ALLOW_LEGACY_TRADE_WIPE
      # Offsite backup mirroring (unset = off, nothing leaves this volume —
      # which is the same volume the database lives on). See "Offsite copies"
      # in docs/DEPLOYMENT.md.
      - BACKUP_OFFSITE_PROVIDER
      - BACKUP_S3_BUCKET
      - BACKUP_S3_REGION
      - BACKUP_S3_ENDPOINT_URL
      - BACKUP_S3_PREFIX
      - BACKUP_S3_ACCESS_KEY_ID
      - BACKUP_S3_SECRET_ACCESS_KEY
      - BACKUP_OFFSITE_RETENTION_DAYS
      # Postgres opt-in. Deliberately NOT a bare `- DATABASE_URL`
      # passthrough: this repo's dev .env sets a RELATIVE sqlite path
      # (sqlite:///./data/dashboard.db, correct when the backend runs with
      # cwd=backend/), and compose would hand that straight to the
      # container — where it resolves against the /app/backend WORKDIR and
      # puts the database in the writable layer instead of the /app/data
      # volume, silently destroying it on every recreate. Set
      # DOCKER_DATABASE_URL to point at Postgres; leave it unset to keep
      # the image's absolute SQLite default.
      - DATABASE_URL=${DOCKER_DATABASE_URL:-sqlite:////app/data/dashboard.db}

volumes:
  trade_data:
