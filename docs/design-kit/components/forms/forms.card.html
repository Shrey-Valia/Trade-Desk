<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--td-bg-0); }
  #root { padding: 18px; }
  .ticket { width: 360px; border: 1px solid var(--td-border); background: var(--td-bg-1); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .qtyrow { display: flex; align-items: center; gap: 12px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cap { font-family: var(--td-font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--td-fg-secondary); }
</style>
</head>
<body class="td-root">
  <div id="root"></div>
  <script type="text/babel">
    const { Stepper, PresetChips, ActionButton } = window.TradeDeskDesignSystem_29ab83;
    function Demo() {
      const [qty, setQty] = React.useState(3);
      const cost = (8.0 * qty).toFixed(2);
      return (
        <div className="ticket">
          <span className="cap">Trade ticket · 759 CALL</span>
          <div className="qtyrow">
            <Stepper value={qty} onChange={setQty} />
            <PresetChips value={qty} onSelect={setQty} />
          </div>
          <div className="actions">
            <ActionButton intent="buy" label={`BUY +${qty}`} sub={`long call · $${cost} debit`} />
            <ActionButton intent="sell" label={`SELL -${qty}`} sub={`short call · $${cost} credit`} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
