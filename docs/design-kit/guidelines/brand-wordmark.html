<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--td-bg-0); font-family: var(--td-font-mono); }
  .wrap { display: flex; flex-direction: column; gap: 18px; padding: 24px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .name { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--td-fg-tertiary-2); width: 90px; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--td-fg-tertiary); margin-top: 4px; }
</style>
</head>
<body class="td-root">
  <div class="wrap">
    <div class="row"><span class="name">Full</span><div><img src="../assets/td-wordmark.svg" height="34" alt="Trade Desk wordmark"><div class="tag">Options · Futures · Terminal</div></div></div>
    <div class="row"><span class="name">Compact</span><img src="../assets/td-wordmark.svg" height="22" alt="Trade Desk wordmark compact"></div>
  </div>
</body>
</html>
